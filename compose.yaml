services:
  atlas:
    build:
      context: .
      args:
        APP_ORIGIN: ${APP_ORIGIN}
    container_name: make-love-atlas
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
